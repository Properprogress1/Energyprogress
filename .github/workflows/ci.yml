name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  foundry:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Install OpenZeppelin
        run: |
          cd contracts
          forge install OpenZeppelin/openzeppelin-contracts@rev=9a0211903755a2d0e342a64738f9c5b88ced8637 --no-git

      - name: Run Forge Build
        run: |
          cd contracts
          forge build --sizes

      - name: Run Forge Tests
        run: |
          cd contracts
          forge test -vv

      - name: Run Fuzz Tests
        run: |
          cd contracts
          forge test --match-test testFuzz -vv

      - name: Run Invariant Tests
        run: |
          cd contracts
          forge test --match-test invariant -vv

      - name: Format Check
        run: |
          cd contracts
          forge fmt --check

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run Type Check
        run: |
          cd apps/web
          npm run build

      - name: Run Lint
        run: |
          cd apps/web
          npm run lint